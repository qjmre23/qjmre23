<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">John Marwin Ebona — from messy data to defensible decisions</title>
  <desc id="desc">A dark emerald banner with circuit and orbit motifs, introducing John Marwin Ebona and his work in applied AI, mobile, and civic software.</desc>
